name: Validate package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependency
        run: python -m pip install aiohttp
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Check JSON metadata
        run: |
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/jk51_billing/manifest.json > /dev/null
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check
